name: build-engine-speed

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Clone upstream at pinned SHA
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/anomalyco/opencode.git src
          git -C src fetch --depth 1 origin 8d05153965bee0a1e46eccffe944dc84d0b0c6f1
          git -C src checkout 8d05153965bee0a1e46eccffe944dc84d0b0c6f1

      - name: Apply speed patch
        run: |
          cd src
          git apply --whitespace=nowarn ../ci/speed.patch
          git diff --stat

      - name: Install deps
        run: cd src && bun install --no-save

      - name: Build linux-x64 (smoke on runner)
        run: cd src/packages/opencode && bun run build --single

      - name: Stash x64 binary
        run: |
          mkdir -p ci/out
          cp src/packages/opencode/dist/opencode-linux-x64/bin/opencode ci/out/opencode-linux-x64

      - name: Smoke test x64
        run: chmod +x ci/out/opencode-linux-x64 && ci/out/opencode-linux-x64 --version

      - name: Build linux-arm64-musl (Android)
        run: cd src/packages/opencode && bun run build --linux-arm64-musl

      - name: Stash arm64-musl binary
        run: |
          cp src/packages/opencode/dist/opencode-linux-arm64-musl/bin/opencode ci/out/opencode-linux-arm64-musl
          file ci/out/opencode-linux-arm64-musl

      - name: Build windows-x64
        run: cd src/packages/opencode && bun run build --windows-x64

      - name: Stash windows binary
        run: |
          cp src/packages/opencode/dist/opencode-windows-x64/bin/opencode ci/out/opencode-windows-x64.exe
          file ci/out/opencode-windows-x64.exe

      - name: Bundle musl loader for Android (Alpine)
        run: |
          mkdir -p ci/musl && cd ci/musl
          wget -q -O musl.apk https://dl-cdn.alpinelinux.org/alpine/v3.20/main/aarch64/musl-1.2.5-r3.apk
          unzip -o musl.apk lib/ld-musl-aarch64.so.1
          cp lib/ld-musl-aarch64.so.1 ../out/ld-musl-aarch64.so.1
          file ../out/ld-musl-aarch64.so.1

      - name: List artifacts
        run: ls -la ci/out

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-speed
          path: ci/out/
          retention-days: 14